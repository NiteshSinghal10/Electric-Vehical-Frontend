version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  

  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
